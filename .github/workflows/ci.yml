name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (test extras only; the core library is dependency-free)
        run: pip install -e ".[tests]"
      - name: Run tests
        run: pytest -q
      - name: Verify the synthetic surface is arbitrage-free
        run: python examples/generate_synthetic_chain.py
